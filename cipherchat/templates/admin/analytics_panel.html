<div class="panel-header">
  <div>
    <h2>Analytics</h2>
    <p>Platform trends and usage over time.</p>
  </div>
</div>
<div class="panel-card">
  <div class="panel-card-header">
    <h3>Key metrics</h3>
  </div>
  <div class="panel-card-body analytics-grid">
    <div>
      <span>New users / week</span>
      <strong>{{ stats.new_users }}</strong>
    </div>
    <div>
      <span>Activity log entries</span>
      <strong>{{ stats.activity_log_count }}</strong>
    </div>
    <div>
      <span>Approved users</span>
      <strong>{{ stats.approved_users }}</strong>
    </div>
    <div>
      <span>Rejected users</span>
      <strong>{{ stats.rejected_users }}</strong>
    </div>
  </div>
</div>
