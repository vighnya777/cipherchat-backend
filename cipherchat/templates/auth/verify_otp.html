<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - CipherChat</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warning-gradient: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            --danger-gradient: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 40px rgba(0, 0, 0, 0.3);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            position: relative;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.15) 0%, transparent 50%);
            animation: backgroundMove 20s ease-in-out infinite;
        }

        @keyframes backgroundMove {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-20px) translateY(-10px); }
            50% { transform: translateX(20px) translateY(10px); }
            75% { transform: translateX(-10px) translateY(20px); }
        }

        /* Particles Container */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Main Container */
        .otp-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* OTP Box */
        .otp-box {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: var(--border-radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-light);
            padding: 40px 30px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .otp-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            z-index: -1;
        }

        .otp-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-heavy);
        }

        /* Header */
        .otp-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .otp-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            background: var(--success-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .otp-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .otp-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        .progress-line {
            position: absolute;
            top: 20px;
            left: 25%;
            right: 25%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .progress-line-fill {
            position: absolute;
            top: 20px;
            left: 25%;
            width: 50%;
            height: 3px;
            background: var(--success-gradient);
            z-index: 2;
            transition: width 0.5s ease;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.5);
        }

        .step.completed .step-circle {
            background: var(--success-gradient);
            border-color: transparent;
            color: white;
        }

        .step.active .step-circle {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #4CAF50;
            color: #4CAF50;
        }

        .step-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            text-align: center;
            font-weight: 500;
        }

        .step.active .step-label {
            color: #4CAF50;
        }

        /* OTP Inputs */
        .otp-inputs-container {
            margin-bottom: 30px;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 55px;
            height: 65px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
            outline: none;
            transform: translateY(-2px);
        }

        .otp-input.filled {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .otp-input.error {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Timer */
        .otp-timer {
            text-align: center;
            margin-bottom: 25px;
        }

        .timer-display {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid rgba(255, 152, 0, 0.3);
            border-radius: 10px;
            padding: 10px 20px;
            backdrop-filter: blur(10px);
        }

        .timer-icon {
            font-size: 1.2rem;
            color: #ff9800;
            margin-right: 10px;
        }

        .timer-text {
            color: rgba(255, 255, 255, 0.8);
            margin-right: 5px;
        }

        #countdown {
            font-weight: 700;
            color: #ff9800;
            font-size: 1.1rem;
        }

        .timer-warning {
            animation: pulse-warning 1s infinite;
            color: #ff9800 !important;
        }

        .timer-critical {
            animation: pulse-warning 0.5s infinite;
            color: #f44336 !important;
        }

        @keyframes pulse-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Buttons */
        .btn-verify {
            background: var(--success-gradient);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            color: white;
            transition: var(--transition);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn-verify::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-verify:hover::before {
            left: 100%;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Resend Section */
        .resend-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .resend-text {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .resend-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-resend, .btn-alternative {
            flex: 1;
            max-width: 200px;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-resend {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-resend:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-resend:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-alternative {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
            color: #8fa3ff;
        }

        .btn-alternative:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        /* Security Info */
        .security-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .security-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .security-icon {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .security-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Back Link */
        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
        }

        .back-link a:hover {
            color: white;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-weight: 500;
            transition: var(--transition);
            max-width: 400px;
        }

        .toast.success {
            border-left: 4px solid #4CAF50;
        }

        .toast.error {
            border-left: 4px solid #f44336;
        }

        .toast.info {
            border-left: 4px solid #2196F3;
        }

        .toast.warning {
            border-left: 4px solid #ff9800;
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            .otp-box {
                padding: 30px 20px;
            }
            
            .otp-title {
                font-size: 1.7rem;
            }
            
            .otp-input {
                width: 45px;
                height: 55px;
                font-size: 1.3rem;
            }
            
            .step-circle {
                width: 35px;
                height: 35px;
                font-size: 0.9rem;
            }
            
            .step-label {
                font-size: 0.7rem;
            }
            
            .resend-buttons {
                flex-direction: column;
            }
            
            .btn-resend, .btn-alternative {
                max-width: 100%;
            }
            
            .security-info {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        @media (max-width: 400px) {
            .otp-input {
                width: 40px;
                height: 50px;
                font-size: 1.2rem;
            }
            
            .otp-inputs {
                gap: 5px;
            }
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <!-- Particles Container -->
    <div id="particles-js" class="particles-container"></div>

    <!-- Main OTP Container -->
    <div class="otp-container">
        <div class="otp-box">
            <!-- Header -->
            <div class="otp-header">
                <div class="otp-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h1 class="otp-title">Two-Factor Authentication</h1>
                <p class="otp-subtitle">Enter the 6-digit verification code sent to your email address to continue</p>
            </div>

            <!-- Progress Steps -->
            <div class="progress-steps">
                <div class="progress-line"></div>
                <div class="progress-line-fill"></div>
                
                <div class="step completed">
                    <div class="step-circle">
                        <i class="bi bi-check-lg"></i>
                    </div>
                    <span class="step-label">Password</span>
                </div>
                
                <div class="step active">
                    <div class="step-circle">
                        <span>2</span>
                    </div>
                    <span class="step-label">OTP Verification</span>
                </div>
                
                <div class="step">
                    <div class="step-circle">
                        <span>3</span>
                    </div>
                    <span class="step-label">Dynamic Password</span>
                </div>
            </div>

            <!-- OTP Form -->
            <form method="POST" id="otpForm" novalidate>
                <div class="otp-inputs-container">
                    <div class="otp-inputs">
                        <input type="text" class="otp-input" maxlength="1" id="otp1" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" id="otp2" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" id="otp3" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" id="otp4" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" id="otp5" autocomplete="off" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" id="otp6" autocomplete="off" inputmode="numeric">
                    </div>
                    
                    <input type="hidden" name="otp" id="otpHidden">
                    
                    <!-- OTP Timer -->
                    <div class="otp-timer">
                        <div class="timer-display">
                            <i class="bi bi-clock timer-icon"></i>
                            <span class="timer-text">Code expires in</span>
                            <span id="countdown" class="timer-text">05:00</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-verify" id="verifyBtn" disabled>
                        <i class="bi bi-shield-check me-2"></i>
                        <span id="verifyText">Verify & Continue</span>
                        <div class="spinner d-none" id="verifySpinner"></div>
                    </button>
                </div>
            </form>

            <!-- Resend Section -->
            <div class="resend-section">
                <p class="resend-text">Didn't receive the code?</p>
                <div class="resend-buttons">
                    <button class="btn-resend" id="resendBtn" disabled>
                        <i class="bi bi-arrow-clockwise me-2"></i>
                        <span id="resendText">Resend OTP</span>
                        <span id="resendCountdown" class="ms-1">(60s)</span>
                    </button>
                    
                    <button class="btn-alternative" id="differentMethodBtn">
                        <i class="bi bi-phone me-2"></i>
                        Other Method
                    </button>
                </div>
            </div>

            <!-- Security Info -->
            <div class="security-info">
                <div class="security-item">
                    <i class="bi bi-clock security-icon text-warning"></i>
                    <span class="security-text">5 min expiry</span>
                </div>
                <div class="security-item">
                    <i class="bi bi-shield-check security-icon text-success"></i>
                    <span class="security-text">Secure</span>
                </div>
                <div class="security-item">
                    <i class="bi bi-envelope security-icon text-primary"></i>
                    <span class="security-text">Email sent</span>
                </div>
            </div>

            <!-- Back to Login -->
            <div class="back-link">
                <a href="/login">
                    <i class="bi bi-arrow-left me-2"></i>Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        // Initialize particles.js
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 40, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.2, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.1, width: 1 },
                    move: { enable: true, speed: 1, direction: "none", random: true, straight: false, out_mode: "out" }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: { onhover: { enable: true, mode: "bubble" }, onclick: { enable: true, mode: "push" } },
                    modes: { bubble: { distance: 100, size: 5, duration: 2, opacity: 0.5 }, push: { particles_nb: 3 } }
                },
                retina_detect: true
            });

            const otpInputs = document.querySelectorAll('.otp-input');
            const otpHidden = document.getElementById('otpHidden');
            const form = document.getElementById('otpForm');
            const verifyBtn = document.getElementById('verifyBtn');
            const verifyText = document.getElementById('verifyText');
            const verifySpinner = document.getElementById('verifySpinner');
            const resendBtn = document.getElementById('resendBtn');
            const resendText = document.getElementById('resendText');
            const resendCountdown = document.getElementById('resendCountdown');
            const countdown = document.getElementById('countdown');
            const differentMethodBtn = document.getElementById('differentMethodBtn');

            let mainTimer = 300; // 5 minutes
            let resendCooldown = 60; // 60 seconds

            // Initialize OTP functionality
            function initializeOTP() {
                // Auto-focus first input
                otpInputs[0].focus();

                // Start timers
                startMainTimer();
                startResendCooldown();

                // Handle OTP input
                otpInputs.forEach((input, index) => {
                    input.addEventListener('input', function(e) {
                        const value = e.target.value;
                        
                        // Only allow digits
                        if (!/^\d$/.test(value)) {
                            e.target.value = '';
                            return;
                        }

                        // Add filled class
                        this.classList.add('filled');
                        this.classList.remove('error');

                        // Move to next input
                        if (value && index < otpInputs.length - 1) {
                            otpInputs[index + 1].focus();
                        }

                        // Update hidden field and check if complete
                        updateOTPValue();
                        checkOTPComplete();
                    });

                    input.addEventListener('keydown', function(e) {
                        // Handle backspace
                        if (e.key === 'Backspace') {
                            if (!e.target.value && index > 0) {
                                otpInputs[index - 1].focus();
                                otpInputs[index - 1].value = '';
                                otpInputs[index - 1].classList.remove('filled');
                            }
                            this.classList.remove('filled');
                            updateOTPValue();
                            checkOTPComplete();
                        }
                        
                        // Handle arrow keys
                        if (e.key === 'ArrowLeft' && index > 0) {
                            otpInputs[index - 1].focus();
                        }
                        if (e.key === 'ArrowRight' && index < otpInputs.length - 1) {
                            otpInputs[index + 1].focus();
                        }
                    });

                    input.addEventListener('focus', function() {
                        this.select();
                    });
                });

                // Handle paste
                document.addEventListener('paste', function(e) {
                    const pasteData = e.clipboardData.getData('text');
                    const digits = pasteData.replace(/\D/g, '').slice(0, 6);
                    
                    if (digits.length === 6) {
                        digits.split('').forEach((digit, i) => {
                            if (otpInputs[i]) {
                                otpInputs[i].value = digit;
                                otpInputs[i].classList.add('filled');
                                otpInputs[i].classList.remove('error');
                            }
                        });
                        
                        updateOTPValue();
                        checkOTPComplete();
                        otpInputs[5].focus();
                    }
                });
            }

            function updateOTPValue() {
                const otp = getOTPValue();
                otpHidden.value = otp;
            }

            function getOTPValue() {
                return Array.from(otpInputs).map(input => input.value).join('');
            }

            function checkOTPComplete() {
                const otp = getOTPValue();
                verifyBtn.disabled = otp.length !== 6;
            }

            function startMainTimer() {
                const timerInterval = setInterval(() => {
                    mainTimer--;
                    
                    const minutes = Math.floor(mainTimer / 60);
                    const seconds = mainTimer % 60;
                    countdown.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    
                    // Add warning styles
                    if (mainTimer <= 60) {
                        countdown.classList.add('timer-warning');
                    }
                    if (mainTimer <= 30) {
                        countdown.classList.add('timer-critical');
                    }
                    
                    if (mainTimer <= 0) {
                        clearInterval(timerInterval);
                        countdown.textContent = '00:00';
                        showToast('OTP has expired. Please request a new code.', 'error');
                        otpInputs.forEach(input => {
                            input.disabled = true;
                            input.classList.add('error');
                        });
                        verifyBtn.disabled = true;
                    }
                }, 1000);
            }

            function startResendCooldown() {
                resendBtn.disabled = true;
                
                const cooldownInterval = setInterval(() => {
                    resendCooldown--;
                    resendCountdown.textContent = `(${resendCooldown}s)`;
                    
                    if (resendCooldown <= 0) {
                        clearInterval(cooldownInterval);
                        resendBtn.disabled = false;
                        resendCountdown.textContent = '';
                        resendText.textContent = 'Resend OTP';
                    }
                }, 1000);
            }

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const otp = getOTPValue();
                
                if (otp.length !== 6) {
                    showToast('Please enter the complete 6-digit code', 'error');
                    shakeForm(form);
                    return;
                }

                // Show loading state
                verifyBtn.disabled = true;
                verifyText.textContent = 'Verifying...';
                verifySpinner.classList.remove('d-none');

                // Submit the form
                setTimeout(() => {
                    form.submit();
                }, 1000);
            });

            // Resend OTP
            resendBtn.addEventListener('click', function() {
                if (resendBtn.disabled) return;

                resendBtn.disabled = true;
                resendText.textContent = 'Sending...';

                // Simulate API call
                setTimeout(() => {
                    showToast('✅ New OTP sent successfully!', 'success');
                    
                    // Reset OTP inputs
                    otpInputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled', 'error');
                        input.disabled = false;
                    });
                    otpInputs[0].focus();
                    updateOTPValue();
                    checkOTPComplete();
                    
                    // Reset and start cooldown
                    resendCooldown = 60;
                    startResendCooldown();
                    
                    // Reset main timer
                    mainTimer = 300;
                    countdown.classList.remove('timer-warning', 'timer-critical');
                    countdown.textContent = '05:00';
                }, 1000);
            });

            // Different method button
            differentMethodBtn.addEventListener('click', function() {
                showToast('Alternative authentication methods would be shown here', 'info');
            });

            // Initialize everything
            initializeOTP();
        });

        // Enhanced toast function
        function showToast(message, type = 'info') {
            // Create toast container if it doesn't exist
            let toastContainer = document.querySelector('.toast-container');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
                document.body.appendChild(toastContainer);
            }

            const toastId = 'toast-' + Date.now();
            const typeIcons = {
                success: 'bi-check-circle-fill text-success',
                error: 'bi-exclamation-circle-fill text-danger',
                warning: 'bi-exclamation-triangle-fill text-warning',
                info: 'bi-info-circle-fill text-info'
            };

            const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-white bg-${type} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">
                            <i class="bi ${typeIcons[type]} me-2"></i>
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;

            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 4000 });
            toast.show();

            // Remove toast from DOM after hide
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }

        // Add shake animation to form on error
        function shakeForm(formElement) {
            formElement.classList.add('shake');
            setTimeout(() => formElement.classList.remove('shake'), 500);
        }
    </script>
</body>
</html>
