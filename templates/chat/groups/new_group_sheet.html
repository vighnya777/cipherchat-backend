<div class="cc-sheet" id="newGroupSheet" aria-hidden="true">
  <div class="cc-sheet-card" role="dialog" aria-modal="true">
    <h3>New group</h3>
    <p>Give it a name and pick members from your contacts.</p>
    <input type="text" id="newGroupName" placeholder="Group name" maxlength="80"
           style="width:100%;background:#202c33;border:0;border-radius:10px;padding:10px 12px;color:#fff;margin-bottom:12px">
    <div class="helper-text" style="font-size:13px;color:#a1a1aa;margin-bottom:8px">Add members by username or email.</div>
    <div id="newGroupMembers" style="max-height:260px;overflow:auto;margin-bottom:12px"></div>
    <div class="sidebar-actions">
      <button type="button" class="btn-new" id="createGroupBtn">Create group</button>
      <button type="button" class="composer-icon-btn" id="closeNewGroupBtn" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>
</div>
