<div class="cc-sheet" id="addMemberSheet" aria-hidden="true">
  <div class="cc-sheet-card" role="dialog" aria-modal="true">
    <h3>Add member</h3>
    <p>Pick a contact or username to add to this group.</p>
    <div class="helper-text" style="font-size:13px;color:#a1a1aa;margin-bottom:8px">You can use either username or email.</div>
    <div id="addMemberList" style="max-height:320px;overflow:auto"></div>
    <div class="sidebar-actions" style="margin-top:12px">
      <button type="button" class="composer-icon-btn" id="closeAddMemberBtn" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>
</div>
